<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jaguaretê</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Jaguaretê: no reino do jaguar. Jogo de estratégia sobre pecuária, jaguares e suçuaranas no Pantanal, na Amazônia, no Cerrado, na Caatinga e na Chapada do Araripe, com dinâmica de presa e predador.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Caveat:wght@600&display=swap">
<style>
/* Layout: mapa hexagonal da paisagem à esquerda, caderneta de campo do fazendeiro à direita; no celular, um embaixo do outro. */
:root {
  --bg: #e9ede1; --superficie: #f7f8f2; --superficie-2: #eef1e7; --linha: #cfd6c4;
  --tinta: #1d281c; --suave: #5a6856; --fraco: #8a9686;
  --onca: #c27a12; --onca-tinta: #8a5200; --perigo: #b0372a; --ok: #2f7a43; --aviso: #a8690b;
  --mata: #2e5a37; --mata-2: #3d7046; --capoeira: #79a35f; --campo: #b9c98c; --campo-alagado: #8fb3b0;
  --pasto: #dcc97d; --pasto-2: #c9b260; --agua: #6b9fb2; --sede: #c7a07a; --queimado: #6b5a4a;
  --voce: #1b5e96; --ia1: #a3442b; --ia2: #6a4ea0; --ia3: #47697a;
  --parda: #b98a5e; --javaporco: #5b3a2a; --raposa: #c0612b;
  --noite: rgba(10, 18, 24, .62);
  --f-titulo: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-texto: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-nota: "Caveat", "Comic Sans MS", cursive;
  --raio: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111611; --superficie: #1a2119; --superficie-2: #212a20; --linha: #34402f;
    --tinta: #e4eadb; --suave: #a3b09c; --fraco: #75826f;
    --onca: #eba23a; --onca-tinta: #f3c47a; --perigo: #e5624f; --ok: #6cc184; --aviso: #e5a640;
    --mata: #1f3d26; --mata-2: #2a4f31; --capoeira: #4b6d3e; --campo: #66764a; --campo-alagado: #3f6461;
    --pasto: #8a7c43; --pasto-2: #75683a; --agua: #2e5a6b; --sede: #8a6b4f; --queimado: #4a3e33;
    --voce: #63aee8; --ia1: #e07a5c; --ia2: #a68be0; --ia3: #8fb3c4;
    --parda: #d2a679; --javaporco: #e0b89a; --raposa: #f08a4b;
    --noite: rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111611; --superficie: #1a2119; --superficie-2: #212a20; --linha: #34402f;
  --tinta: #e4eadb; --suave: #a3b09c; --fraco: #75826f;
  --onca: #eba23a; --onca-tinta: #f3c47a; --perigo: #e5624f; --ok: #6cc184; --aviso: #e5a640;
  --mata: #1f3d26; --mata-2: #2a4f31; --capoeira: #4b6d3e; --campo: #66764a; --campo-alagado: #3f6461;
  --pasto: #8a7c43; --pasto-2: #75683a; --agua: #2e5a6b; --sede: #8a6b4f; --queimado: #4a3e33;
  --voce: #63aee8; --ia1: #e07a5c; --ia2: #a68be0; --ia3: #8fb3c4;
  --parda: #d2a679; --javaporco: #e0b89a; --raposa: #f08a4b;
  --noite: rgba(0, 0, 0, .6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--tinta); font: 15px/1.5 var(--f-texto);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; }
button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--onca); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-titulo); line-height: 1.15; text-wrap: balance; margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.rotulo { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--suave); }

/* ---------- tela inicial ---------- */
.inicio { max-width: 1080px; margin: 0 auto; padding-block: 28px 40px; display: grid; gap: 28px; }
.inicio-cabeca { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 28px; align-items: end; }
.marca { font-family: var(--f-titulo); font-weight: 800; font-size: clamp(44px, 9vw, 92px); letter-spacing: -.03em; line-height: .9; }
.marca span { color: var(--onca); }
.subtitulo { font-family: var(--f-nota); font-size: clamp(26px, 4vw, 34px); color: var(--onca-tinta); line-height: 1; margin-top: 6px; }
.inicio-cabeca p { margin: 12px 0 0; max-width: 58ch; color: var(--suave); font-size: 17px; }
.nota { font-family: var(--f-nota); font-size: 22px; color: var(--onca-tinta); line-height: 1.1; }
.biomas { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.bioma { text-align: left; border: 1px solid var(--linha); background: var(--superficie); border-radius: var(--raio); padding: 0; cursor: pointer;
  display: grid; grid-template-rows: auto 1fr; overflow: hidden; transition: transform .15s, border-color .15s; }
.bioma:hover { transform: translateY(-2px); border-color: var(--onca); }
.bioma[aria-pressed="true"] { border-color: var(--onca); box-shadow: 0 0 0 2px var(--onca); }
.bioma svg { display: block; width: 100%; height: 86px; }
.bioma-corpo { padding: 12px 14px 14px; display: grid; gap: 6px; align-content: start; }
.bioma-corpo h3 { font-size: 20px; }
.bioma-corpo p { margin: 0; font-size: 13.5px; color: var(--suave); }
.status { font-size: 12px; display: inline-flex; gap: 6px; align-items: center; }
.status b { color: var(--perigo); }
.inicio-acoes { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.regras { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px 24px; border-top: 1px solid var(--linha); padding-top: 20px; }
.regras h3 { font-size: 16px; margin-bottom: 4px; }
.regras p { margin: 0; font-size: 14px; color: var(--suave); }
.licenca { margin: 0; font-size: 13px; color: var(--suave); border-top: 1px solid var(--linha); padding-top: 14px; }
.licenca a { color: inherit; }

.btn { border: 1px solid var(--linha); background: var(--superficie); border-radius: 8px; padding: 9px 14px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; justify-content: center; }
.btn:hover:not(:disabled) { border-color: var(--tinta); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-forte { background: var(--tinta); color: var(--bg); border-color: var(--tinta); font-weight: 700; }
.btn-forte:hover:not(:disabled) { background: var(--onca-tinta); border-color: var(--onca-tinta); color: var(--superficie); }
.btn-perigo { border-color: var(--perigo); color: var(--perigo); }
.btn-perigo.armado { background: var(--perigo); color: var(--superficie); }
.btn-mini { padding: 5px 9px; font-size: 13px; }

/* ---------- jogo ---------- */
.app { max-width: 1320px; margin: 0 auto; padding-block: 12px 24px; display: grid; gap: 12px; }
.topo { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; justify-content: space-between; }
.topo-marca { display: flex; gap: 12px; align-items: baseline; }
.topo-marca strong { font-family: var(--f-titulo); font-size: 26px; letter-spacing: -.02em; }
.topo-marca strong span { color: var(--onca); }
.chip { font-size: 12px; border: 1px solid var(--linha); border-radius: 999px; padding: 2px 10px; background: var(--superficie); white-space: nowrap; }
.chip-ok { border-color: var(--ok); color: var(--ok); }
.chip-perigo { border-color: var(--perigo); color: var(--perigo); }
.indicadores { display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: center; }
.ind { display: grid; gap: 0; }
.ind b { font-size: 18px; font-variant-numeric: tabular-nums; }
.calendario { display: flex; gap: 3px; align-items: center; }
.calendario i { width: 7px; height: 16px; border-radius: 2px; background: var(--linha); display: block; }
.calendario i.passou { background: var(--suave); }
.calendario i.agora { background: var(--onca); }
.calendario i.seca { height: 11px; }
.acoes-pips { display: flex; gap: 4px; }
.acoes-pips i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--tinta); display: block; }
.acoes-pips i.cheia { background: var(--tinta); }

.jogo { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 14px; align-items: start; }
.mapa-wrap { position: relative; background: var(--superficie); border: 1px solid var(--linha); border-radius: var(--raio); padding: 8px; min-width: 0; }
#mapa { width: 100%; height: auto; display: block; touch-action: manipulation; }
.mapa-noite { position: absolute; inset: 8px; border-radius: 6px; background: var(--noite); pointer-events: none; opacity: 0; transition: opacity .5s; display: grid; place-items: center; }
.mapa-noite.on { opacity: 1; }
.mapa-noite span { font-family: var(--f-nota); font-size: 34px; color: #f3e6c8; }
.legenda { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 8px 6px 2px; font-size: 12px; color: var(--suave); }
.legenda span { display: inline-flex; gap: 5px; align-items: center; }
.legenda i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.legenda svg { width: 14px; height: 14px; }

/* células do mapa */
.cel { cursor: pointer; }
.cel polygon.base { stroke: var(--superficie); stroke-width: 1.5; }
.t-mata { fill: var(--mata); } .t-capoeira { fill: var(--capoeira); } .t-campo { fill: var(--campo); } .t-campo.alagado { fill: var(--campo-alagado); }
.t-pasto { fill: var(--pasto); } .t-agua { fill: var(--agua); } .t-sede { fill: var(--sede); }
.cel.queimado polygon.base { fill: var(--queimado); }
.cel:hover polygon.base { filter: brightness(1.08); }
.cel polygon.selecao { fill: none; stroke: none; pointer-events: none; }
.cel.sel polygon.selecao { stroke: var(--tinta); stroke-width: 3.5; }
.cel.alvo polygon.selecao { stroke: var(--onca); stroke-width: 3; stroke-dasharray: 5 4; fill: none; }
.glifo-arvore { fill: var(--mata-2); }
.cel.t-cap .glifo-arvore { fill: var(--mata); }
.contorno { fill: none; stroke-width: 3.2; stroke-linecap: round; pointer-events: none; }
.contorno.f0 { stroke: var(--voce); } .contorno.f1 { stroke: var(--ia1); } .contorno.f2 { stroke: var(--ia2); } .contorno.f3 { stroke: var(--ia3); }
.divisa { fill: none; stroke-width: 1.4; stroke-dasharray: 1.5 3; stroke-linecap: round; pointer-events: none; opacity: .8; }
.divisa.f0 { stroke: var(--voce); } .divisa.f1 { stroke: var(--ia1); } .divisa.f2 { stroke: var(--ia2); } .divisa.f3 { stroke: var(--ia3); }
.cerca-linha { fill: none; stroke-width: 3.4; stroke-linecap: round; pointer-events: none; }
.cerca-linha.f0 { stroke: var(--voce); } .cerca-linha.f1 { stroke: var(--ia1); } .cerca-linha.f2 { stroke: var(--ia2); } .cerca-linha.f3 { stroke: var(--ia3); }
.cerca-linha.m-nativa { stroke-dasharray: 5 3; }
.cerca-linha.m-concreto { stroke-width: 4.6; }
.cerca-linha.vencendo { opacity: .45; }
.contorno.reserva { stroke: var(--onca-tinta); stroke-dasharray: 2 6; stroke-width: 2.4; }
.selo-cel { font: 700 9px var(--f-texto); fill: var(--tinta); }
.cracha rect { fill: var(--superficie); opacity: .92; }
.cracha text { font: 700 11px var(--f-texto); fill: var(--tinta); }
.cracha use { color: var(--tinta); }
.marcador use { color: var(--tinta); }
.m-pegada use { color: #f6e7c5; }
.m-onca circle { fill: var(--onca); stroke: #2a1a00; stroke-width: 1.2; }
.m-onca use { color: #2a1a00; }
.m-onca.colar circle { stroke: var(--superficie); stroke-width: 2.5; }
.m-onca.parda circle { fill: var(--parda); }
.m-ataque use { color: var(--perigo); }
.m-camera rect { fill: var(--superficie); }
.pulso { animation: pulso 1.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pulso { from { opacity: .9; transform: scale(.6); } to { opacity: 0; transform: scale(1.6); } }
.rotulo-mapa { font: 700 10px var(--f-texto); letter-spacing: .1em; text-transform: uppercase; fill: var(--onca-tinta); pointer-events: none; paint-order: stroke; stroke: var(--superficie); stroke-width: 3.5px; stroke-linejoin: round; }
.nome-fazenda { font: 700 11px var(--f-texto); pointer-events: none; paint-order: stroke; stroke: var(--superficie); stroke-width: 3px; }

/* painel */
.painel { background: var(--superficie); border: 1px solid var(--linha); border-radius: var(--raio); display: grid; grid-template-rows: auto 1fr auto; min-width: 0;
  position: sticky; top: max(12px, env(safe-area-inset-top, 0px)); max-height: calc(100vh - 24px); }
.abas { display: flex; border-bottom: 1px solid var(--linha); overflow-x: auto; }
.abas button { flex: 1; border: 0; background: none; padding: 11px 8px; cursor: pointer; font-size: 13.5px; color: var(--suave); border-bottom: 3px solid transparent; white-space: nowrap; }
.abas button[aria-selected="true"] { color: var(--tinta); border-bottom-color: var(--onca); font-weight: 700; }
.painel-conteudo { overflow-y: auto; padding: 14px 16px; display: grid; gap: 14px; align-content: start; min-height: 260px; }
.painel-rodape { border-top: 1px solid var(--linha); padding: 12px 16px; display: grid; gap: 8px; }
.painel-rodape .btn-forte { width: 100%; padding: 12px; font-size: 16px; }
.msg { font-size: 13.5px; padding: 8px 10px; border-radius: 6px; background: var(--superficie-2); border-left: 3px solid var(--onca); }
.msg.erro { border-left-color: var(--perigo); }
.bloco { display: grid; gap: 8px; }
.bloco h3 { font-size: 17px; }
.cab-cel { display: flex; gap: 10px; align-items: center; }
.cab-cel .amostra { width: 34px; height: 34px; border-radius: 8px; flex: none; }
.linha-info { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; border-bottom: 1px dashed var(--linha); padding-bottom: 4px; }
.linha-info span:first-child { color: var(--suave); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.botoes { display: flex; flex-wrap: wrap; gap: 6px; }
.acao { width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; text-align: left; border: 1px solid var(--linha); background: var(--superficie); border-radius: 8px; padding: 9px 12px; cursor: pointer; }
.acao:hover:not(:disabled) { border-color: var(--tinta); }
.acao:disabled { cursor: not-allowed; opacity: .55; }
.acao small { grid-column: 1 / -1; color: var(--suave); font-size: 12.5px; }
.acao .custo { font-variant-numeric: tabular-nums; color: var(--suave); white-space: nowrap; }
.acao.perigo { border-color: color-mix(in srgb, var(--perigo) 50%, var(--linha)); }
.acao.armado { background: var(--perigo); color: var(--superficie); border-color: var(--perigo); }
.acao.armado small, .acao.armado .custo { color: var(--superficie); }
.barra { height: 10px; border-radius: 6px; background: var(--superficie-2); border: 1px solid var(--linha); position: relative; overflow: hidden; }
.barra i { position: absolute; inset: 0 auto 0 0; background: var(--mata-2); }
.barra b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--perigo); }
.tabela { width: 100%; border-collapse: collapse; font-size: 14px; }
.tabela td, .tabela th { padding: 6px 4px; border-bottom: 1px solid var(--linha); text-align: left; }
.tabela td.num, .tabela th.num { text-align: right; }
.ponto { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: middle; }
.natureza { background: var(--superficie-2); border-radius: 8px; padding: 12px 14px; display: grid; gap: 6px; }
.natureza .nota { font-size: 24px; }
.natureza p { margin: 0; font-size: 14px; }
.natureza small { color: var(--suave); }
.vazio { color: var(--suave); font-size: 14px; }

/* modal */
.modal { position: fixed; inset: 0; background: rgba(8, 12, 8, .55); display: grid; place-items: center; z-index: 20;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal-caixa { background: var(--superficie); color: var(--tinta); border-radius: 14px; width: min(760px, 100%); max-height: 100%; overflow-y: auto; padding: 22px 24px; display: grid; gap: 16px; border: 1px solid var(--linha); }
.modal-caixa h2 { font-size: 28px; }
.modal-acoes { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; position: sticky; bottom: -22px; background: var(--superficie); padding-block: 10px 0; }
.rel-grade { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 20px; }
.rel-grade > div { min-width: 0; }
.lista { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 14px; }
.perda { color: var(--perigo); font-weight: 700; }
.ganho { color: var(--ok); font-weight: 700; }
.graficos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grafico { min-width: 0; }
.grafico svg { width: 100%; height: auto; display: block; }
.grafico .eixo { stroke: var(--linha); stroke-width: 1; }
.grafico .grade { stroke: var(--linha); stroke-width: .6; stroke-dasharray: 2 3; }
.grafico text { fill: var(--suave); font: 10px var(--f-texto); }
.grafico .serie { fill: none; stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
.s-onca { stroke: var(--onca); } .s-javaporco { stroke: var(--javaporco); } .s-agua { stroke: var(--agua); } .s-presa { stroke: var(--mata-2); } .s-meso { stroke: var(--ia2); }
.s-f0 { stroke: var(--voce); } .s-f1 { stroke: var(--ia1); } .s-f2 { stroke: var(--ia2); } .s-f3 { stroke: var(--ia3); }
.grafico .ponto-fim { stroke: var(--superficie); stroke-width: 2; }
.equacao { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; background: var(--superficie-2); padding: 10px 12px; border-radius: 6px; overflow-x: auto; white-space: pre; }

@media (max-width: 980px) {
  .jogo { grid-template-columns: minmax(0, 1fr); }
  .painel { position: static; max-height: none; }
  .painel-rodape { position: sticky; bottom: 0; background: var(--superficie); border-radius: 0 0 var(--raio) var(--raio); padding-bottom: max(12px, env(safe-area-inset-bottom, 0px)); }
  .biomas { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .inicio-cabeca { grid-template-columns: minmax(0, 1fr); }
  .regras { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 560px) {
  .biomas, .regras, .rel-grade, .graficos { grid-template-columns: minmax(0, 1fr); }
  .ind b { font-size: 16px; }
  .topo-marca strong { font-size: 22px; }
  .modal-caixa { padding: 18px 16px; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

</style>
</head>
<body>

<div id="inicio"></div>
<div id="app" class="app" hidden>
  <header class="topo" id="topo"></header>
  <main class="jogo">
    <section class="mapa-wrap" aria-label="Mapa da paisagem">
      <svg id="mapa" role="img" aria-label="Mapa hexagonal com as fazendas, a mata e a reserva"></svg>
      <div class="mapa-noite" id="noite"><span>a noite cai na mata…</span></div>
      <div class="legenda" id="legenda"></div>
    </section>
    <aside class="painel" aria-label="Caderneta do fazendeiro">
      <nav class="abas" role="tablist" id="abas"></nav>
      <div class="painel-conteudo" id="painel"></div>
      <div class="painel-rodape" id="rodape"></div>
    </aside>
  </main>
</div>
<div id="modal" class="modal" hidden><div class="modal-caixa" id="modal-caixa" role="dialog" aria-modal="true"></div></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

 tipo II). Com comida sobrando, nascem mais jaguares; com mais jaguares, as presas diminuem; com menos presas, os jaguares passam fome e diminuem, e o ciclo recome\xE7a. O pico de jaguares vem sempre depois do pico de presas.",ref:"Lotka (1925); Volterra (1926); Holling (1959); Rosenzweig e MacArthur (1963)."},ataque:{titulo:"Por que o jaguar ataca o rebanho",texto:"Jaguares preferem capivaras, queixadas, veados e jacar\xE9s. No jogo, o rebanho que fica na borda da mata \xE9 uma segunda presa no mesmo modelo: quanto menos presas silvestres, maior a fra\xE7\xE3o da ca\xE7a que recai sobre bois e carneiros. Animais longe da mata, cercados ou recolhidos \xE0 noite ficam fora do card\xE1pio.",ref:"Holling (1959); Morato et al. (2013)."},desmate:{titulo:"Menos mata, menos presas",texto:"Cada \xE1rea desmatada reduz o limite de presas silvestres que a regi\xE3o sustenta. Com menos presas, a mesma paisagem sustenta menos jaguares, e os que restam ficam mais perto do pasto. A perda e a fragmenta\xE7\xE3o do habitat s\xE3o a principal amea\xE7a ao jaguar (on\xE7a-pintada) no Brasil.",ref:"Morato et al. (2013)."},abate:{titulo:"O que muda quando um jaguar morre",texto:"Matar jaguar \xE9 crime ambiental (Lei n\xBA 9.605/1998, art. 29), e a ca\xE7a em retalia\xE7\xE3o a ataques ao rebanho est\xE1 entre as principais amea\xE7as \xE0 esp\xE9cie. Sem o jaguar, gamb\xE1s e cachorros-do-mato se multiplicam e atacam galinheiros: \xE9 a libera\xE7\xE3o de mesopredadores. As presas silvestres tamb\xE9m crescem e passam a disputar o pasto. No jogo, o territ\xF3rio vago ainda atrai jovens jaguares em dispers\xE3o, que se arriscam mais perto das fazendas.",ref:"Crooks e Soul\xE9 (1999); Morato et al. (2013)."},desmate_araripe:{titulo:"Menos mata, menos presas",texto:"Cada \xE1rea desmatada reduz o limite de presas silvestres, como tatus, cotias e veados, que sustentam a su\xE7uarana. A perda e a fragmenta\xE7\xE3o do habitat, ligadas \xE0 expans\xE3o agropecu\xE1ria, est\xE3o entre as principais amea\xE7as \xE0 esp\xE9cie. Na APA, o novo plano de manejo s\xF3 admite abrir \xE1rea na Zona de Produ\xE7\xE3o, fora das APPs e respeitando a reserva legal.",ref:"Azevedo et al. (2013); ICMBio (2026)."},ataque_araripe:{titulo:"Por que a su\xE7uarana ataca o rebanho",texto:"A su\xE7uarana prefere presas silvestres de porte m\xE9dio. No jogo, o rebanho na borda da mata \xE9 uma segunda presa no mesmo modelo, e os carneiros pesam mais que os bois, porque ela ataca sobretudo ovinos, caprinos e bezerros. Quanto menos presas silvestres, maior a fra\xE7\xE3o de ataques ao rebanho.",ref:"Holling (1959); Azevedo et al. (2013)."},abate_araripe:{titulo:"O que muda quando uma su\xE7uarana morre",texto:"Matar su\xE7uarana \xE9 crime ambiental (Lei n\xBA 9.605/1998, art. 29), e a retalia\xE7\xE3o por ataques a animais dom\xE9sticos est\xE1 entre as principais amea\xE7as \xE0 esp\xE9cie. Sem ela, gamb\xE1s e raposas se multiplicam e atacam galinheiros, e as presas silvestres crescem a ponto de disputar o pasto.",ref:"Azevedo et al. (2013); Crooks e Soul\xE9 (1999)."},fogo_araripe:{titulo:"Fogo na Chapada",texto:"Na seca, o fogo corre pelo cerrado do alto da chapada e pode descer a encosta, transformando a mata \xFAmida das nascentes em capoeira, que leva anos para voltar a ser mata. O novo plano de manejo limita o uso do fogo em toda a APA, e aceiros ajudam a conter as queimadas.",ref:"ICMBio (2026)."},monitoramento_araripe:{titulo:"Contar su\xE7uaranas",texto:"Armadilhas fotogr\xE1ficas registram su\xE7uaranas, jaguatiricas, gatos-mouriscos e cotias na Chapada do Araripe. Como a su\xE7uarana n\xE3o tem rosetas, reconhecer cada indiv\xEDduo pelas fotos \xE9 mais dif\xEDcil: pesquisadores usam cicatrizes e outras marcas, al\xE9m de colares GPS, que mostram por onde ela anda.",ref:null},herbivoros_araripe:{titulo:"Cascata tr\xF3fica",texto:"Sem predadores suficientes, caititus, veados e cotias se multiplicam e comem pasto e ro\xE7a. O predador do topo controla, de forma indireta, a vegeta\xE7\xE3o que est\xE1 dois n\xEDveis abaixo dele na cadeia alimentar.",ref:"Rosenzweig e MacArthur (1963)."},mesopredador:{titulo:"Libera\xE7\xE3o de mesopredadores",texto:"Os grandes felinos ca\xE7am e intimidam predadores menores. Quando eles somem, esses mesopredadores aumentam e passam a atacar presas pequenas, como aves. O efeito foi descrito em fragmentos de mata na Calif\xF3rnia, onde a aus\xEAncia de coiotes coincidiu com mais gatos e gamb\xE1s e menos aves.",ref:"Crooks e Soul\xE9 (1999)."},mesopredador_caatinga:{titulo:"A raposa no galinheiro",texto:"No Nordeste, raposa \xE9 o nome popular do cachorro-do-mato. Tolerante \xE0 presen\xE7a humana, ele visita as fazendas \xE0 noite e eventualmente ataca aves dom\xE9sticas. Na Caatinga, onde o jaguar quase desapareceu, predadores m\xE9dios como a raposa ficam mais livres: \xE9 a libera\xE7\xE3o de mesopredadores. O guia do ICMBio sobre conflitos com carn\xEDvoros lembra que o cachorro-do-mato muitas vezes leva a culpa por perdas causadas por outros animais noturnos. Galinheiro fechado \xE0 noite resolve a maior parte do problema.",ref:"Cavalcanti, Paula e Gasparini-Morato (2015); Crooks e Soul\xE9 (1999)."},herbivoros:{titulo:"Cascata tr\xF3fica",texto:"Sem predadores suficientes, capivaras e queixadas se multiplicam e comem pasto e ro\xE7a. O predador do topo controla, de forma indireta, a vegeta\xE7\xE3o que est\xE1 dois n\xEDveis abaixo dele na cadeia alimentar.",ref:"Rosenzweig e MacArthur (1963)."},defesa:{titulo:"Proteger sem matar",texto:"Cercas el\xE9tricas, currais noturnos e animais de guarda reduzem os ataques sem matar o predador. Na Venezuela, em seis fazendas estudadas, a chance de um bovino ser morto por predadores foi cerca de 25 vezes maior que a de um b\xFAfalo, que se defende em grupo.",ref:"Hoogesteijn e Hoogesteijn (2008)."},monitoramento:{titulo:"Contar jaguares",texto:"Pesquisadores contam jaguares com armadilhas fotogr\xE1ficas: cada um tem um padr\xE3o pr\xF3prio de rosetas, que identifica o indiv\xEDduo nas fotos. Colares GPS mostram por onde o jaguar anda e ajudam a prever onde o rebanho corre mais risco.",ref:null},cheia:{titulo:"O pulso das \xE1guas",texto:"No Pantanal, a cheia cobre os campos nativos e empurra animais silvestres e gado para as partes altas. Os campos voltam a render quando a \xE1gua baixa. O jaguar (on\xE7a-pintada) foi avaliado como vulner\xE1vel no Pantanal.",ref:"Morato et al. (2013)."},seca:{titulo:"Semi\xE1rido",texto:"Na Caatinga, o jaguar (on\xE7a-pintada) foi avaliado como criticamente em perigo. Sem a vegeta\xE7\xE3o nativa, o solo do semi\xE1rido fica exposto, perde \xE1gua e fertilidade, e o pasto rende cada vez menos na seca. No jogo, quanto menos vegeta\xE7\xE3o nativa na fazenda, menor a capacidade do pasto na seca.",ref:"Morato et al. (2013)."},fogo:{titulo:"Fogo no Cerrado",texto:"Na seca, o fogo corre pelos campos do Cerrado e pode transformar mata em capoeira, que leva anos para voltar a ser mata. O jaguar (on\xE7a-pintada) foi avaliado como em perigo no Cerrado.",ref:"Morato et al. (2013)."},reserva:{titulo:"Reserva legal",texto:"O C\xF3digo Florestal obriga cada im\xF3vel rural a manter parte da vegeta\xE7\xE3o nativa como reserva legal: 80% nas \xE1reas de floresta da Amaz\xF4nia Legal, 35% no cerrado dentro da Amaz\xF4nia Legal e 20% nas demais regi\xF5es. No jogo, o Cerrado usa a regra de 20%, v\xE1lida fora da Amaz\xF4nia Legal.",ref:"Lei n\xBA 12.651/2012, art. 12."},cra:{titulo:"Cota de Reserva Ambiental",texto:"Quem mant\xE9m vegeta\xE7\xE3o nativa al\xE9m do exigido pode emitir Cotas de Reserva Ambiental e vend\xEA-las a quem precisa compensar falta de reserva legal. No jogo, cada \xE1rea nativa acima da reserva rende um pouco por esta\xE7\xE3o depois do registro.",ref:"Lei n\xBA 12.651/2012, art. 44."},onca_parda:{titulo:"Su\xE7uarana",texto:"O jaguar (on\xE7a-pintada) \xE9 considerado provavelmente extinto no Cear\xE1 pela lista estadual de mam\xEDferos amea\xE7ados de 2022. Na Chapada do Araripe, as armadilhas fotogr\xE1ficas registram a su\xE7uarana, nome tupi da on\xE7a-parda. Ela \xE9 oportunista e prefere presas de uns 15 kg, como tatus, cotias e veados; entre os animais dom\xE9sticos, ataca mais ovinos, caprinos e bezerros. Est\xE1 avaliada como vulner\xE1vel no Brasil e em perigo na Caatinga.",ref:"Azevedo et al. (2013); lista de mam\xEDferos amea\xE7ados do Cear\xE1 (2022)."},plano:{titulo:"O novo plano de manejo",texto:"O plano de manejo da APA Chapada do Araripe, aprovado pelo ICMBio em agosto de 2026, dividiu a APA em zonas. A Zona de Produ\xE7\xE3o, com 89,86% da \xE1rea (cerca de 914 mil hectares), admite agricultura, pecu\xE1ria e silvicultura, respeitando reserva legal, APP e licenciamento. Nas zonas de Uso Moderado s\xF3 cabem ro\xE7as de subsist\xEAncia, e nas de Uso Restrito n\xE3o se abrem \xE1reas novas. Em toda a APA ficam proibidas a pulveriza\xE7\xE3o a\xE9rea de agrot\xF3xicos e o plantio de transg\xEAnicos, o fogo \xE9 limitado e novas capta\xE7\xF5es de \xE1gua devem ficar a 50 metros das nascentes.",ref:"ICMBio, plano de manejo da APA Chapada do Araripe (2026)."},soldadinho:{titulo:"Soldadinho-do-araripe",texto:"O soldadinho-do-araripe, ave criticamente em perigo e exclusiva do Cear\xE1, vive nas matas \xFAmidas da encosta da Chapada, ligadas \xE0s nascentes. A mata em volta de cada nascente \xE9 \xC1rea de Preserva\xE7\xE3o Permanente, num raio m\xEDnimo de 50 metros. Em 2025 foi criado o Ref\xFAgio de Vida Silvestre do Soldadinho-do-Araripe, com cerca de 5.540 hectares em Crato, Barbalha e Miss\xE3o Velha. No jogo, a popula\xE7\xE3o dele depende da mata em volta das nascentes, da recarga de \xE1gua no alto da chapada e do fogo.",ref:"Lei n\xBA 12.651/2012, art. 4\xBA; Brasil de Fato (2026)."},recarga:{titulo:"A chapada \xE9 uma esponja",texto:"A Chapada do Araripe \xE9 \xE1rea de recarga das nascentes, aqu\xEDferos e rios que abastecem o Cariri: a chuva infiltra no alto e brota na encosta. No jogo, quanto menos vegeta\xE7\xE3o nativa no alto da chapada, mais fracas correm as nascentes do vale na seca, o que reduz o pasto das fazendas de baixo e o habitat do soldadinho. \xC9 uma simplifica\xE7\xE3o: o jogo n\xE3o calcula a \xE1gua de verdade.",ref:null},javaporco:{titulo:"Javaporco",texto:"O javali (Sus scrofa) \xE9 uma das cem piores esp\xE9cies ex\xF3ticas invasoras do mundo, segundo a IUCN, e cruza com o porco dom\xE9stico, dando o javaporco. Ele revira o solo, provoca eros\xE3o e assoreamento e destr\xF3i lavouras. Em cerca de duas d\xE9cadas, espalhou-se principalmente pelo Pampa, pela Mata Atl\xE2ntica e pelo Cerrado.",ref:"Plano Nacional do Javali (Ibama, 2017)."},javaporco_pantanal:{titulo:"Porco-monteiro",texto:"O porco-monteiro descende de porcos dom\xE9sticos que se asselvajaram no Pantanal h\xE1 mais de dois s\xE9culos. \xC9 da mesma esp\xE9cie do javali (Sus scrofa), vive sobretudo onde h\xE1 campo e pastagem e fu\xE7a os campos em busca de ra\xEDzes. No jogo, ele reduz o pasto e serve de presa para o jaguar.",ref:"Plano Nacional do Javali (Ibama, 2017); Cordeiro et al. (2018)."},javaporco_amazonia:{titulo:"Javaporcos na Amaz\xF4nia",texto:"O javali avan\xE7a em dire\xE7\xE3o \xE0 Amaz\xF4nia: o sistema do Ibama para manejo de fauna (SIMAF) registra varas no Acre, em Rond\xF4nia e no norte de Mato Grosso, na divisa com o Amazonas, desde 2018. No jogo, a invas\xE3o come\xE7a pequena; sem controle, ela cresce r\xE1pido.",ref:"SIMAF, segundo RealTime1 (2023)."},manejo:{titulo:"Ca\xE7adores de manejo",texto:"O controle do javali \xE9 permitido por manejadores inscritos no Cadastro T\xE9cnico Federal, com autoriza\xE7\xE3o emitida pelo SIMAF e relat\xF3rio ao fim de cada autoriza\xE7\xE3o, que vale no m\xE1ximo 3 meses. Armas de fogo precisam de registro no Ex\xE9rcito. A autoriza\xE7\xE3o vale para o javali e o javaporco: abater jaguar, caititu ou qualquer outro animal nativo continua sendo crime. Como os javaporcos se reproduzem r\xE1pido, o controle s\xF3 funciona se for cont\xEDnuo e feito por muitas propriedades.",ref:"IN Ibama n\xBA 3/2013; IN Ibama n\xBA 12/2019."},competicao:{titulo:"Competi\xE7\xE3o aparente",texto:"Uma presa invasora que se multiplica r\xE1pido pode alimentar mais predadores, que ent\xE3o ca\xE7am tamb\xE9m as presas nativas e o rebanho. \xC9 a competi\xE7\xE3o aparente. No jogo, o jaguar tamb\xE9m ca\xE7a os porcos asselvajados: eles o sustentam, mas empurram a popula\xE7\xE3o dele para cima.",ref:"Holt (1977)."},aceiro:{titulo:"Aceiros",texto:"Aceiros s\xE3o faixas sem vegeta\xE7\xE3o que impedem o fogo de passar. Na Chapada do Araripe, o fogo na seca amea\xE7a a mata da encosta onde vive o soldadinho, e o novo plano de manejo limita o uso do fogo em toda a APA.",ref:null},grilagem:{titulo:"Grilagem",texto:"Grilagem \xE9 a apropria\xE7\xE3o ilegal de terra alheia ou p\xFAblica. Deslocar cerca ou marco para se apropriar de im\xF3vel alheio \xE9 crime de altera\xE7\xE3o de limites (C\xF3digo Penal, art. 161), e invadir terras p\xFAblicas para ocup\xE1-las tamb\xE9m \xE9 crime (Lei n\xBA 4.947/1966, art. 20). No jogo, cercar a terra aberta de um vizinho, ou uma unidade de conserva\xE7\xE3o, tira o seu selo; a cada esta\xE7\xE3o, a Justi\xE7a pode devolver a \xE1rea e multar quem grilou.",ref:"C\xF3digo Penal, art. 161; Lei n\xBA 4.947/1966, art. 20."},cercas:{titulo:"Cercas e mour\xF5es",texto:"Uma cerca de arame depende dos mour\xF5es, as estacas que a sustentam. Madeira tirada da pr\xF3pria mata e sem tratamento apodrece mais r\xE1pido; eucalipto tratado dura mais; mour\xF5es de concreto duram d\xE9cadas e n\xE3o queimam. No jogo, o custo de cercar depende de quantos lados da \xE1rea ficam expostos: \xE1reas juntas saem mais baratas.",ref:null},compensacao:{titulo:"Compensa\xE7\xE3o por ataques",texto:"Alguns projetos de conserva\xE7\xE3o pagam ao fazendeiro parte do valor dos animais mortos por grandes felinos, desde que n\xE3o haja retalia\xE7\xE3o. A ideia \xE9 dividir o custo de conviver com um an
